site_name: Gmoon Docs
site_description: Gmoon documentation
theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/gemoon-logo.svg
  favicon: assets/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - content.code.copy
extra_css:
  - stylesheets/web3.css
extra_javascript:
  - javascripts/header.js
nav:
  - Get Started:
      - Overview: index.md
      - Quick start: quick-start.md
  - Guides:
      - Launch a coin: guides/launch-a-coin.md
      - Trade: guides/trade.md
      - Earn: guides/earn.md
      - Referrals: guides/referrals.md
  - Concepts:
      - Trading fees: concepts/trading-fees.md
      - Vault and rewards: concepts/vault-and-rewards.md
      - Reward assets: concepts/reward-assets.md
      - Anti-sniper fee: concepts/anti-sniper-fee.md
  - Resources:
      - Supported assets: resources/supported-assets.md
      - Contracts: resources/contracts.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: false
      title: On this page

extra:
  generator: false
